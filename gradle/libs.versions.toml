[versions]
agp = "8.5.1"
kotlin = "1.9.0"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
navigationFragmentKtx = "2.8.5"
navigationUiKtx = "2.8.5"
lifecycleExtension = "2.2.0"
lifecycleKtx = "2.8.7"
coroutine = "1.7.3"
firebaseFirestore = "25.1.1"
firebaseAuth = "23.1.0"
daggerVersion = "2.46"
androidxHilt = "1.0.0"
gson = "2.10"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
